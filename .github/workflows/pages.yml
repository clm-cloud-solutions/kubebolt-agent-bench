# Publica el sitio estático (resultados, escenarios, lotes, runs, duelos guardados e informe) en GitHub Pages
# en cada push a main. Sin dominio propio el sitio cuelga de /<repo>/ y el exportador prefija todas las
# rutas; con dominio propio, define la variable de repositorio SITE_BASE con el valor "/" (raíz).
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run selftest
      - run: npm run export-site -- --base "${SITE_BASE:-/${{ github.event.repository.name }}}"
        env:
          SITE_BASE: ${{ vars.SITE_BASE }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
